name: stem

# One run per change: a pull request runs on `pull_request`, and `push` runs only on
# master after a merge. A push to a pull request's branch used to start a second,
# identical run. A newer push to a pull request cancels the older run.
on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - contracts/**
      - .github/workflows/stem.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - contracts/**
      - .github/workflows/stem.yml

permissions:
  contents: read

concurrency:
  group: stem-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on master after a merge, Ubuntu on every pull request as well. The Free
        # plan runs only a few macOS jobs at once across all public repositories, so a macOS
        # leg on every pull request delayed the other beds' CI. A macOS-only break shows on
        # master's run, the commit after it lands.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      # Build output keyed by the toolchain and Cargo.lock: a pull request restores master's.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ratchet:Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
