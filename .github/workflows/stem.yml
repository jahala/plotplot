name: stem

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - contracts/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - contracts/**

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
