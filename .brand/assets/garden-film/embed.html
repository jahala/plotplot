<!--
  plotplot · the garden film, embed.
  Paste three things into the page: the <style>, the <section class="pp-film"> and the <script>.
  The film prints straight onto the page: no paper of its own, so the band is the page. On soil-night
  the inks switch to their night values.
  This file is the one home of the film's code; build.mjs wraps it into garden.html.
-->
<style>
.pp-film{position:relative;color:var(--pp-text)}
.pp-film-stage{position:relative;width:100%;aspect-ratio:4 / 1;max-height:520px;min-height:160px;overflow:hidden}
.pp-film-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the soil fades into whatever follows the band: full ink to the soil line (73%), nothing at the bottom edge */
.pp-film-stage canvas{-webkit-mask-image:linear-gradient(to bottom,var(--pp-text) 74%,transparent);mask-image:linear-gradient(to bottom,var(--pp-text) 74%,transparent)}
@media (max-width:880px){.pp-film-stage{aspect-ratio:3 / 1}}
@media (max-width:520px){.pp-film-stage{aspect-ratio:2 / 1}}
</style>

<section class="pp-film" aria-label="a garden grows and returns to the soil">
  <div class="pp-film-stage">
    <canvas role="img" aria-label="A printed garden in section grows from seed to bloom and returns to the soil."></canvas>
  </div>
</section>

const smoothInv = (y) => 0.5 - Math.sin(Math.asin(clamp(1 - 2 * y, -1, 1)) / 3);

/* Copyright (c) 2026 sevenevesai. MIT License; full text in film/THIRD-PARTY.md */

  const young = 1 - smooth(phase(S.g, 0.86, 0.14));
  const girth = 0.5 + 0.5 * smooth(S.g * 1.3);
  const wAt = (s) => lerp(w0, w1, s / S.total) * girth * lerp(1, clamp((sp.len - s) / 16, 0.22, 1), young);
  const seg = (a, b, dry) => {
    if (b - a < 0.2) return;
    const pts = spineSlice(sp, a, b);
    flesh(F, nib(pts, (u) => wAt(lerp(a, b, u)), { per: 3 }), dry);
  };
  seg(0, Math.min(dryFrom, sp.len), false);
  if (S.dry > 0) seg(dryFrom, sp.len, true);
}

/* the growing tip: a folded bud that is spent as the plant reaches its height */
function tipBud(F, sp, S) {
  const k = Math.min(1, (1 - S.g) * 7) * clamp((sp.len - SEED_D) / 10, 0, 1) * (1 - S.hook * 0.6);
  if (k <= 0.02) return;
  const tip = spineAt(sp, sp.len), d = spineDir(sp, sp.len);
  for (const side of [-1, 1]) leaf(F, tip[0] - Math.cos(d) * 2.5, tip[1] - Math.sin(d) * 2.5, d + side * 0.16, 8 * k, 1.7 * k, { bend: 0, skew: 0.45 });
}
/* seed leaves: a round pair just above the soil that withers as the plant matures */
function seedLeaves(F, p, sp, S, t) {
  const node = SEED_D + 9;
  if (sp.len < node + 2) return;
  const open = unfold(phase(t, p.shoot + 1.3, 1.2)) * (1 - smooth(phase(t, p.shoot + p.grow * 0.75, 1.8)));
  if (open <= 0.02) return;
  const n = spineAt(sp, node), d = spineDir(sp, node);
  for (const side of [-1, 1]) leaf(F, n[0], n[1], d + side * 0.72, 10 * open, 2.5 * open, { bend: 0, skew: 0.64 });
}

/* a leaf from a node: unfolds on the brand ease, droops at evening */
function leaf(F, x, y, ang, len, wid, o) {
  o = o || {};
  if (len < 0.4) return;
  const bend = o.bend === undefined ? 0.35 : o.bend;
  const pts = [];
  // the midrib leaves along ang and droops under its own weight
  for (let i = 0; i <= 4; i++) {
    const u = i / 4, d = len * u;
    pts.push([x + Math.cos(ang) * d, y + Math.sin(ang) * d + bend * len * 0.55 * u * u]);
  }
  const path = nib(pts, wLeaf(wid, o.skew || 0.5), { per: 4 });
  flesh(F, path, o.dry);
  if (o.vein && len > 6 && !o.dry) F.x('green', nib(pts.slice(0, 4), (u) => 0.28 * (1 - u), { per: 3 }));
}

/* roots in section: seeded curves that grow from the seed and retract into it */
const ROOTS = {};
function rootSet(p, n, depth, spread) {
  if (ROOTS[p.id]) return ROOTS[p.id];
  const r = rngFor('garden:roots:' + p.id), set = [];
  const main = [[0, 0]];
  for (let i = 1; i <= 6; i++) main.push([(r() - 0.5) * 5 * i / 3, depth * i / 6]);
  set.push({ pts: main, at: 0, w: 0.95 });
  for (let k = 0; k < n; k++) {
    const f = 0.15 + 0.7 * (k + r() * 0.6) / n, side = k % 2 ? 1 : -1;
    const o = [main[Math.round(f * 6)][0], depth * f];
    const L = spread * (0.5 + r() * 0.6) * (1 - f * 0.4);
    const pts = [o];
    for (let i = 1; i <= 4; i++) pts.push([o[0] + side * L * i / 4, o[1] + L * 0.45 * (i / 4) + (r() - 0.5) * 3]);
    set.push({ pts, at: f, w: 0.6 });
  }
  return (ROOTS[p.id] = set);
}
function drawRoots(F, p, S, set) {
  if (S.root <= 0.001) return;
  const [bx, by] = p.base;
  for (const rt of set) {
    const u = clamp((S.root - rt.at * 0.8) / (1 - rt.at * 0.8), 0, 1);
    if (u <= 0.01) continue;
    const c = curve(rt.pts.map(([x, y]) => [bx + x, by + y]), false, 5);
    const n = Math.max(2, Math.round(c.length * u));
    F.f('brown', 1, nib(c.slice(0, n), (v) => rt.w * (1 - 0.75 * v), { raw: true }));
  }
}

/* a seed: brown, with a paper glint; cracks as the root leaves it */
function drawSeed(F, x, y, a, scale, crack) {
  if (scale <= 0.02) return;
  const path = ellipse(x, y, 3.6 * scale, 2.3 * scale, a);
  F.f('brown', 1, path);
  F.x('brown', ellipse(x - 1.1 * scale, y - 0.7 * scale, 0.9 * scale, 0.45 * scale, a));
  if (crack > 0) F.x('brown', nib([[x - 2.8 * scale * crack, y], [x + 2.8 * scale * crack, y + 0.4]], () => 0.3, { raw: true }));
}

/* seed life: falls from the head, lands, sinks to its depth, waits for dawn */
function seedLife(F, p, t, headAt) {
  const [bx, by] = p.base, land = gy(bx) - 1.6;
  const tr = rngFor('garden:seed:' + p.id);
  const a0 = tr() * 3;
  if (t < p.drop) {
    // resting from the loop start until the seed coat is spent
    const spent = smooth(phase(t, p.shoot + 0.6, 2.4));
    drawSeed(F, bx, by, a0, 1 - spent, phase(t, p.root, 0.5));
    return;
  }
  const h = headAt(p.drop);
  const fallDur = 0.55 + Math.sqrt(Math.max(0, land - h[1])) * 0.075;
  const u = phase(t, p.drop, fallDur);
  const sinkU = smooth(phase(t, p.drop + fallDur + 0.5, 23.4 - (p.drop + fallDur + 0.5)));
  let x, y;
  if (u < 1) {
    const e = easeInQuad(u);
    x = lerp(h[0], bx, smooth(u)) + Math.sin(u * 5.2 + a0) * 3 * (1 - u);
    y = lerp(h[1], land, e);
  } else { x = bx; y = lerp(land, by, sinkU); }
  const a = lerp(a0 + 2.4, a0, smooth(u));
  drawSeed(F, x, y, a, 1, 0);
}

/* ── the scenes ─────────────────────────────────────────────────────────── */

function sceneSun(F, t) {
  const u = phase(t, TL.sunRise, TL.sunSet - TL.sunRise);
  const x = lerp(1412, 1290, u), y = gy(x) + 30 - Math.pow(Math.sin(Math.PI * u), 0.75) * 218;
  if (y > gy(x) + 29) return;
  const r = rngFor('garden:sun');
  const R = 23;
  const body = cut(ringPts(x, y, R, R, 12, 0), r, { amp: 0.8 });
  F.scope({ clip: 'sky' }, () => {
    F.f('sun', 0.12, disc(x, y, R + 24));
    F.f('sun', 0.3, disc(x, y, R + 10));
    F.f('sun', 1, body);
    const dusk = smooth(phase(t, 18.3, 3.2));
    if (dusk > 0) {
      F.f('petal', Math.ceil(dusk * 4) / 4, body);
      F.f('petal', 0.12 * dusk, disc(x, y, R + 10));
    }
  });
}

function sceneGlow(F, t) {
  const dusk = Math.max(bumpC(t, TL.glowDusk[0], TL.glowDusk[1]), 0), dawn = bumpC(t, TL.glowDawn[0], TL.glowDawn[1]);
  const band = (h, x0, ink, cov) => {
    if (h < 1) return;
    const w = makeWob(rngFor('garden:glow:' + ink), 4), pts = [[x0 - 40, gy(x0) + 4]];
    for (let x = x0 - 40; x <= 2300; x += 16) {
      const fall = smooth((x - x0) / 260);
      pts.push([x, gy(x) - h * fall * (0.85 + 0.15 * w(x / 90))]);
    }
    pts.push([2300, G0 + 6]);
    F.f(ink, cov, poly(pts));
  };
  F.scope({ clip: 'sky' }, () => {
    band(dusk * 70, 720, 'petal', 0.1);
    band(dusk * 34, 820, 'petal', 0.2);
    band(dusk * 46, 760, 'sun', 0.1);
    band(dawn * 52, 900, 'sun', 0.12);
    band(dawn * 24, 980, 'sun', 0.22);
  });
}

/* tend: a tended seedling, a cane, a poppy tie */
function sceneTend(F, t) {
  const p = P.tend, S = stateOf(p, t);
  drawRoots(F, p, S, rootSet(p, 3, 18, 10));
  seedLife(F, p, t, (tt) => spineAt(mainStem(p, tt, stateOf(p, tt)), stateOf(p, tt).len));
  const sp = mainStem(p, t, S);
  soilStem(F, sp, S, 1.7, 1.3);
  sky(F, p, S, () => {
    drawStem(F, sp, S, 1.7, 1.15);
    const dir = S.len > 1 ? spineDir(sp, sp.len) : -Math.PI / 2;
    const tip = spineAt(sp, sp.len);
    // cotyledons at the tip while young, true leaves above later
    const cot = unfold(phase(t, p.shoot + 1.4, 1.2)) * (1 - S.hook);
    const nodeC = spineAt(sp, Math.min(sp.len, SEED_D + 26));
    const dC = spineDir(sp, Math.min(sp.len, SEED_D + 26));
    const droop = S.fold * 0.9;
    for (const side of [-1, 1]) leaf(F, nodeC[0], nodeC[1], dC + side * (1.2 - 0.4 * (1 - cot)) + droop * side, 11 * cot, 3.8, { side, dry: S.dry > 0.6, bend: 0.12, skew: 0.62 });
    const tl = unfold(phase(t, p.shoot + 3.2, 1.6));
    for (const side of [-1, 1]) leaf(F, tip[0], tip[1], dir + side * 0.7 + droop * side, 16 * tl, 5, { side: -side, dry: S.dry > 0.2, vein: true, bend: 0.25 });
    // the tie: a poppy loop from stem to cane, wrapped in, unwrapped at evening
    const tie = phase(t, TL.tie[0], TL.tie[1]) * (1 - phase(t, TL.untie[0], TL.untie[1]));
    if (tie > 0 && sp.len > SEED_D + 21) {
      const a = spineAt(sp, SEED_D + 20), cx = 431.8, cy = a[1];
      const loop = [];
      for (let i = 0; i <= 16; i++) { const th = i / 16 * TAU * tie; loop.push([lerp(a[0], cx, 0.5) + Math.cos(th + Math.PI) * (cx - a[0]) * 0.66, cy + Math.sin(th + Math.PI) * 2.3]); }
      const path = nib(loop, () => 0.95, { raw: true });
      F.f('petal', 1, path); F.f('sun', 1, path);
    }
  });
}

/* weeder: a stray thistle and the shears that come for it */
function weedGeo(t) {
  const p = P.weed, S = stateOf(p, t);
  return { p, S, sp: mainStem(p, t, S, { swayAmp: 0.12 }) };
}
function sceneWeed(F, t) {
  const { p, S, sp } = weedGeo(t);
  drawRoots(F, p, S, rootSet(p, 4, 24, 13));
  seedLife(F, p, t, (tt) => { const g = weedGeo(tt); return spineAt(g.sp, g.sp.len); });
  // the rosette: toothed leaves low on the soil
  const ros = unfold(phase(t, p.shoot + 0.9, 1.8));
  const [bx] = p.base, sy = gy(bx);
  sky(F, p, S, () => {
    const r = rngFor('garden:weed:ros');
    for (let k = 0; k < 5; k++) {
      const side = k % 2 ? 1 : -1, a = -Math.PI / 2 + side * (0.95 + k * 0.16) + (r() - 0.5) * 0.2 + S.fold * side * 0.4;
      const L = (17 + r() * 7) * ros;
      if (L < 0.5) { r(); continue; }
      const pts = [];
      for (let i = 0; i <= 12; i++) {
        const u = i / 12, w = Math.sin(Math.PI * Math.pow(u, 0.7)) * (2.8 + (i % 2 ? 2.1 : 0)) * ros;
        const [ox, oy] = rot(u * L, -w, a);
        pts.push([bx + ox, sy - 1 + oy]);
      }
      for (let i = 12; i >= 0; i--) {
        const u = i / 12, w = Math.sin(Math.PI * Math.pow(u, 0.7)) * (2.6 + (i % 2 ? 0 : 1.9)) * ros;
        const [ox, oy] = rot(u * L, w, a);
        pts.push([bx + ox, sy - 1 + oy]);
      }
      flesh(F, poly(pts), S.dry > 0.7);
    }
  });
  soilStem(F, sp, S, 1.6, 1.2);
  // the stalk: whole until the snip, then the top falls away and lies on the soil
  const snipT = TL.snip[0] + TL.snip[1] * 0.8;
  const cutS = SEED_D + 21;
  sky(F, p, S, () => {
    if (t < snipT || sp.len < cutS + 1) { drawStem(F, sp, S, 1.6, 1.05); thistle(F, t, S, sp, 0, [0, 0]); return; }
    const lower = { pts: spineSlice(sp, 0, cutS), seg: 0, len: cutS };
    flesh(F, nib(lower.pts, (u) => lerp(1.6, 1.3, u), { per: 3 }), S.dry > 0.7);
    // the fallen top pivots about the cut and drops to the soil
    const fu = phase(t, snipT, 0.75), e = easeInQuad(fu);
    const c = spineAt(sp, cutS), top = spineSlice(sp, cutS, sp.len);
    const ang = -1.35 * e, drop = e * (sy - c[1] - 2.2) + (fu >= 1 ? 0 : 0);
    const moved = top.map(([x, y]) => { const [ox, oy] = rot(x - c[0], y - c[1], ang); return [c[0] + ox - e * 4, c[1] + oy + drop]; });
    flesh(F, nib(moved, (u) => lerp(1.3, 1.05, u), { per: 3 }), S.dry > 0.3);
    thistle(F, t, S, { pts: moved, seg: 0, len: 0 }, ang, [c[0], c[1]], moved[moved.length - 1], spineDir(sp, sp.len) + ang);
  });
}
function thistle(F, t, S, sp, ang, pivot, tipOverride, dirOverride) {
  const p = P.weed;
  const tip = tipOverride || spineAt(sp, sp.len), dir = dirOverride === undefined ? spineDir(sp, sp.len) : dirOverride;
  const bud = unfold(phase(t, p.shoot + 3.0, 1.2)), open = unfold(phase(t, p.shoot + 5.6, 1.4));
  if (bud <= 0) return;
  const [cx, cy] = [tip[0] + Math.cos(dir) * 4.4 * bud, tip[1] + Math.sin(dir) * 4.4 * bud];
  const body = ellipse(cx, cy, 4.6 * bud, 5.6 * bud, dir + Math.PI / 2);
  flesh(F, body, S.dry > 0.4);
  F.f('brown', 0.28, body);
  if (open > 0) {
    // the brush: fine petal-ink bristles, overprinted to bramble
    const r = rngFor('garden:thistle');
    const brush = new Path2D();
    for (let i = 0; i < 11; i++) {
      const a = dir + (i / 10 - 0.5) * 1.6 + (r() - 0.5) * 0.1, L = (8 + r() * 3) * open;
      const bx = cx + Math.cos(dir) * 3.6 * bud, by = cy + Math.sin(dir) * 3.6 * bud;
      brush.addPath(nib([[bx, by], [bx + Math.cos(a) * L, by + Math.sin(a) * L]], (u) => 0.95 * (1 - 0.6 * u), { raw: true }));
    }
    const fade = 1 - S.dry;
    if (fade > 0.05) { F.f('petal', 1, brush); F.f('brown', 0.36, brush); }
    else F.f('brown', 0.5, brush);
  }
}

/* the shears: orange handles, bare blades. They rest on the soil, rise and open
   at the weed, hold, snip at evening, and lie down again. */
function sceneShears(F, t) {
  const lift = unfold(phase(t, TL.shearLift[0], TL.shearLift[1]));
  const home = easeInOut(phase(t, TL.shearHome[0], TL.shearHome[1]));
  const k = lift * (1 - home);
  const rest = { x: 574, y: gy(574) - 3.2, a: Math.PI + 0.03 };
  const aim = { x: 542, y: 240, a: Math.PI - 0.05 };
  const K = 1.45;
  const x = lerp(rest.x, aim.x, k), y = lerp(rest.y, aim.y, k) - Math.sin(Math.PI * k) * 5 * (1 - home > 0.5 ? 1 : 0.4);
  const a = lerp(rest.a, aim.a, k);
  const open = 0.04 + 0.5 * unfold(phase(t, TL.shearOpen[0], TL.shearOpen[1])) * (1 - easeInQuad(phase(t, TL.snip[0], TL.snip[1])));
  const blade = (sgn) => {
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const u = i / 8, w = ((1 - u) * 2.6 + 0.2) * K, curveOff = Math.sin(u * Math.PI) * 1.2 * K * sgn;
      pts.push([u * 21 * K, curveOff - w * 0.5 * sgn]);
    }
    for (let i = 8; i >= 0; i--) {
      const u = i / 8, w = ((1 - u) * 2.6 + 0.2) * K, curveOff = Math.sin(u * Math.PI) * 1.2 * K * sgn;
      pts.push([u * 21 * K, curveOff + w * 0.5 * sgn * 0.1]);
    }
    const ba = a + sgn * open / 2;
    return poly(pts.map(([px, py]) => { const [ox, oy] = rot(px, py, ba); return [x + ox, y + oy]; }));
  };
  const handle = (sgn) => {
    const ha = a + Math.PI - sgn * open / 2;
    const pts = [[0, -1.2], [8, -1.6 + sgn * 0.6], [16, -2.4 + sgn * 1.8], [21, -1.2 + sgn * 2.6], [21.5, 1.6 + sgn * 2.6], [16, 1.4 + sgn * 1.6], [8, 1.3 + sgn * 0.4], [0, 1.2]];
    const outer = curve(pts, true, 4).map(([px, py]) => { const [ox, oy] = rot(px * K, py * K, ha); return [x + ox, y + oy]; });
    return poly(outer);
  };
  F.scope({ clip: null }, () => {
    for (const sgn of [-1, 1]) {
      const b = blade(sgn);
      F.f('brown', 0.22, b);
      F.s('brown', 1, b, 0.7);
      const h = handle(-sgn);
      F.f('sun', 1, h);
      F.s('brown', 1, h, 0.55);
    }
    F.f('brown', 1, disc(x, y, 1.7));
    F.x('brown', disc(x - 0.4, y - 0.4, 0.55));
  });
}

/* copeca: a stem measured against a rule; the marker steps up tick by tick */
const RULE = { x: 686, w: 13, top: 100, tick: 8 };
function copecaGeo(t) { const p = P.rule, S = stateOf(p, t); return { p, S, sp: mainStem(p, t, S, { swayAmp: 0.025 }) }; }
function heightAt(t) { const g = copecaGeo(t); const tip = spineAt(g.sp, g.sp.len); return Math.max(0, gy(g.p.x) - tip[1] - g.S.sink * g.p.sinkD); }
function sceneRule(F, t) {
  const { p, S, sp } = copecaGeo(t);
  drawRoots(F, p, S, rootSet(p, 5, 34, 16));
  seedLife(F, p, t, (tt) => { const g = copecaGeo(tt); return spineAt(g.sp, g.sp.len); });
  soilStem(F, sp, S, 2.0, 1.5);
  sky(F, p, S, () => {
    drawStem(F, sp, S, 2.0, 1.3);
    seedLeaves(F, p, sp, S, t); tipBud(F, sp, S);
    const nodes = [0.3, 0.5, 0.68, 0.84];
    nodes.forEach((v, i) => {
      const s = SEED_D + v * p.H;
      if (sp.len < s) return;
      const tn = p.shoot + p.grow * smoothInv(s / S.total);
      const lg = unfold(phase(t, tn, 1.3));
      const n = spineAt(sp, s), d = spineDir(sp, s);
      const side = i % 2 ? 1 : -1;
      leaf(F, n[0], n[1], d + side * (0.95 + S.fold * 0.8), (21 - i * 2.5) * lg, 3.1, { side, dry: S.dry > 1 - v, skew: 0.68, bend: 0.4, vein: true });
    });
    // the daisy: paper rays in a brown keyline, a sunlight eye
    const tip = spineAt(sp, sp.len), dir = spineDir(sp, sp.len);
    const bud = unfold(phase(t, p.shoot + p.grow - 1.4, 1.2)), open = unfold(phase(t, TL.daisy, 1.3));
    const drop = smooth(phase(t, TL.petalFall + 0.9, 1.6));
    if (bud > 0) {
      const c = [tip[0] + Math.cos(dir) * 2.4, tip[1] + Math.sin(dir) * 2.4];
      if (open > 0 && drop < 1) {
        const rays = new Path2D();
        for (let i = 0; i < 9; i++) {
          const a = dir + (i / 9) * TAU + 0.2, L = 9.5 * open * (1 - drop * (i % 3 === 0 ? 1 : smooth(drop * 1.6 - 0.3)));
          if (L < 0.6) continue;
          const [ox, oy] = [Math.cos(a), Math.sin(a)];
          rays.addPath(ellipse(c[0] + ox * (2.4 + L / 2), c[1] + oy * (2.4 + L / 2), L / 2, 1.5, a));
        }
        F.s('brown', 1, rays, 0.45);
      }
      F.f(S.dry > 0.2 ? 'brown' : 'sun', 1, disc(c[0], c[1], 3 * bud));
      if (S.dry > 0.2) F.f('sun', 0.5, disc(c[0], c[1], 3 * bud));
    }
  });
  // the marker: a sunlight notch at the tick below the tip, stepping between ticks
  const h = heightAt(t);
  if (h > 1) {
    const k = Math.floor(h / RULE.tick);
    let y;
    if (k < 1) y = gy(RULE.x);
    else {
      // when did the tip cross this tick? bisection on the monotone stretch
      const rising = t < p.fold;
      let lo = rising ? p.shoot : p.fold, hi = t;
      for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; const hm = heightAt(m); if (rising ? hm < k * RULE.tick : hm > (k + 1) * RULE.tick) lo = m; else hi = m; }
      const since = t - hi, e = unfold(clamp(since / 0.35, 0, 1));
      const from = rising ? (k - 1) : (k + 1), to = k;
      y = gy(RULE.x) - lerp(from, to, e) * RULE.tick;
    }
    const mx = RULE.x - 0.5;
    F.f('sun', 1, poly([[mx, y], [mx - 7, y - 3.6], [mx - 7, y + 3.6]]));
    const tip = spineAt(sp, sp.len);
    const dash = new Path2D();
    for (let xx = tip[0] + 4; xx < mx - 6; xx += 3) { dash.moveTo(xx, y); dash.lineTo(Math.min(xx + 1.4, mx - 6), y); }
    F.s('brown', 1, dash, 0.4);
  }
}

/* petals: an open five-petal flower; its petals fall at evening */
function petalGeo(t) { const p = P.petal, S = stateOf(p, t); return { p, S, sp: mainStem(p, t, S, { swayAmp: 0.05 }) }; }
function petalShape(cx, cy, a, len, wid, key) {
  const pts = [];
  const n = 9;
  for (let i = 0; i <= n; i++) { const u = i / n, w = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.42)), 0.55) * wid; pts.push([u * len, -w]); }
  for (let i = n; i >= 0; i--) { const u = i / n, w = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.42)), 0.55) * wid; pts.push([u * len, w]); }
  // a shallow notch at the tip

function scenePetal(F, t) {
  const { p, S, sp } = petalGeo(t);

  const headAt = (tt) => { const g = petalGeo(tt); return spineAt(g.sp, g.sp.len); };
  seedLife(F, p, t, headAt);

    seedLeaves(F, p, sp, S, t); tipBud(F, sp, S);
    [[0.24, -1, 27], [0.43, 1, 24], [0.62, -1, 19]].forEach(([v, side, L]) => {
      const s = SEED_D + v * p.H;

      const lg = unfold(phase(t, tn, 1.5));

      if (t >= fall) continue;
      const a = lerp(dir + (i - 2) * 0.16, face + i * TAU / 5, o);
      const len = lerp(7 * bud, R, o), wid = lerp(2.6 * bud, 13.5, o);
      const path = petalShape(c[0], c[1], a, len, wid, 'garden:petal:' + i);
      F.f('petal', 1, path);

    const r = rngFor('garden:fallen:' + i);
    const a0 = face + i * TAU / 5;
    const hc = headAt(fall);
    const sx = hc[0] + Math.cos(a0) * R * 0.5, sy = hc[1] + Math.sin(a0) * R * 0.5;
    const lx = sx + (r() - 0.35) * 70, ly = gy(lx) - 1.5;

    const y = lerp(sy, ly, pr);

}

/* pleach: two young trees on a frame, their arms woven over and under */
const FRAME = { x0: 846, x1: 964, top: 110, wires: [210, 172, 134] };
function scenePleach(F, t) {
  const p1 = P.pl1, p2 = P.pl2, S1 = stateOf(p1, t), S2 = stateOf(p2, t);
  drawRoots(F, p1, S1, rootSet(p1, 5, 40, 18));
  drawRoots(F, p2, S2, rootSet(p2, 5, 38, 18));
  const trunk = (p, S) => spine(p.base, S.total, S.len, headingOf(p, t, S, { swayAmp: 0.01 }), 16);
  const sp1 = trunk(p1, S1), sp2 = trunk(p2, S2);

    seedLeaves(F, p1, sp1, S1, t); seedLeaves(F, p2, sp2, S2, t); tipBud(F, sp1, S1); tipBud(F, sp2, S2);
    const lam = 6, A = 2.3;
    const arms = [];
    FRAME.wires.forEach((wy, w) => {
      // tree 1: right arm to the far post (woven), short left arm; tree 2 mirrors it
      arms.push({ tree: 0, w, x0: p1.x, x1: FRAME.x1 + 2, wy, sgn: 1 });
      arms.push({ tree: 0, w, x0: p1.x, x1: FRAME.x0 - 2, wy, sgn: 1 });
      arms.push({ tree: 1, w, x0: p2.x, x1: FRAME.x0 - 2, wy, sgn: -1 });
      arms.push({ tree: 1, w, x0: p2.x, x1: FRAME.x1 + 2, wy, sgn: -1 });
    });
    const S = [S1, S2], sps = [sp1, sp2];
    const armY = (arm, x) => arm.wy + arm.sgn * A * Math.sin((x - p1.x) / lam) * smooth(Math.abs(x - arm.x0) / 8);
    const blossoms = [];
    for (const arm of arms) {
      const trunkTop = gy(PLANTS[arm.tree === 0 ? 4 : 5].x) - sps[arm.tree].len + SEED_D;
      if (trunkTop > arm.wy + 1) continue;             // the trunk has not reached this wire
      const g = armGrow(arm.tree, arm.w);

      const n = Math.max(2, Math.ceil(Math.abs(xe - arm.x0) / 2));

      const dry = S[arm.tree].dry > 0.3;

      const step = 7, dir = Math.sign(arm.x1 - arm.x0);
      for (let d = 5, i = 0; d < Math.abs(xe - arm.x0) - 2; d += step, i++) {
        const x = arm.x0 + dir * d, y = armY(arm, x), side = i % 2 ? 1 : -1;
        const tn = armT[arm.tree][arm.w] + 3.2 * smoothInv(clamp(d / Math.abs(arm.x1 - arm.x0), 0, 1));
        const lg = unfold(phase(t, tn + 0.3, 1.1)) * g;

      const fall = TL.petalFall + 0.3 + hashInt(hash(b.key + 'f')) * 1.8;

        y = lerp(b.y, gy(b.x) - 1, u * u); x += Math.sin(u * 7) * 3 * (1 - u); s = bl * (1 - 0.35 * u);
        if (u >= 1) continue;
      }
      const fl = new Path2D();
      for (let i = 0; i < 5; i++) { const a = i / 5 * TAU + hashInt(hash(b.key)) * 2; fl.addPath(disc(x + Math.cos(a) * 1.9 * s, y + Math.sin(a) * 1.9 * s, 1.35 * s)); }
      F.x('green', fl);                               // a blossom owns its paper: no mud over leaves
      F.f('petal', 1, fl);
      F.f('sun', 1, disc(x, y, 0.8 * s));
    }
  });
}

/* umbel: rays from one point to a dome of umbellets; florets become seeds */
function umbelGeo(t) { const p = P.umbel, S = stateOf(p, t); return { p, S, sp: mainStem(p, t, S, { swayAmp: 0.05, curl: 0.08 }) }; }
function sceneUmbel(F, t) {
  const { p, S, sp } = umbelGeo(t);
  drawRoots(F, p, S, rootSet(p, 6, 52, 22));
  const headAt = (tt) => { const g = umbelGeo(tt); const tip = spineAt(g.sp, g.sp.len); return [tip[0] + 8, tip[1] - 28]; };
  seedLife(F, p, t, headAt);
  soilStem(F, sp, S, 3.1, 2.2);
  sky(F, p, S, () => {
    drawStem(F, sp, S, 3.1, 1.7);
    seedLeaves(F, p, sp, S, t); tipBud(F, sp, S);
    // thread leaves: a sheath and fine pinnae, fennel-like
    [[0.2, -1, 38], [0.36, 1, 34], [0.52, -1, 26]].forEach(([v, side, L], li) => {
      const s = SEED_D + v * p.H;
      if (sp.len < s) return;
      const tn = p.shoot + p.grow * smoothInv(s / S.total);
      const lg = unfold(phase(t, tn, 1.8));
      if (lg <= 0.02) return;
      const n = spineAt(sp, s), d = spineDir(sp, s) + side * (0.82 + S.fold * 0.7);
      const rach = [];
      for (let i = 0; i <= 6; i++) { const u = i / 6, a = d + side * 0.5 * u * u; rach.push([n[0] + Math.cos(a) * L * lg * u, n[1] + Math.sin(a) * L * lg * u + u * u * 6 * lg]); }
      const c = curve(rach, false, 3);
      const threads = new Path2D();
      threads.addPath(nib(c, (u) => 0.75 * (1 - 0.6 * u), { raw: true }));
      for (let i = 2; i < c.length - 1; i += 2) {
        const [x0, y0] = c[i], [x1, y1] = c[i + 1], ta = Math.atan2(y1 - y0, x1 - x0);
        const pl = (7.5 - i * 0.28) * lg;
        for (const ps of [-1, 1]) {
          const a = ta + ps * 0.95;
          threads.addPath(nib([[x0, y0], [x0 + Math.cos(a) * pl * 0.6, y0 + Math.sin(a) * pl * 0.6 - 0.8], [x0 + Math.cos(a - ps * 0.3) * pl, y0 + Math.sin(a - ps * 0.3) * pl - 2]], (u) => 0.42 * (1 - 0.7 * u), { per: 3 }));
        }
      }
      flesh(F, threads, S.dry > 1 - v);
    });
  });
  // the umbel
  const tip = spineAt(sp, sp.len), dir = spineDir(sp, sp.len);
  const open = unfold(phase(t, TL.umbelOpen[0], TL.umbelOpen[1]));
  const bud = unfold(phase(t, p.shoot + p.grow - 2.2, 1.4));
  if (bud <= 0) return;
  const tilt = dir + Math.PI / 2;               // the head turns with the stalk
  const N = 13, r = rngFor('garden:umbel');
  const rays = new Path2D(), sub = new Path2D();
  const florets = [], seeds = [];
  for (let k = 0; k < N; k++) {
    const sN = k / (N - 1) * 2 - 1;
    const jx = (r() - 0.5) * 5, jy = (r() - 0.5) * 5, delay = r();
    const E = [sN * 58 + jx, -30 + 15 * sN * sN + jy];
    const C = [sN * 3, -9 * bud];
    const [ex, ey] = rot(lerp(C[0], E[0], open), lerp(C[1], E[1], open), tilt);
    const end = [tip[0] + ex, tip[1] + ey];
    const mid = [tip[0] + ex * 0.5 - Math.sin(tilt) * 0 + sN * 3 * open, tip[1] + ey * 0.5 - 3 * open];
    rays.addPath(nib(curve([tip, mid, end], false, 5), (u) => 0.75 - 0.25 * u, { raw: true }));
    // the umbellet: six short rays to florets
    const uo = unfold(phase(t, TL.umbelOpen[0] + 0.5 + delay * 0.5, 1.3));
    for (let j = 0; j < 6; j++) {
      const sj = j / 5 * 2 - 1;
      const [fx, fy] = rot(sj * 7.5 * uo, (-6 + 3 * sj * sj) * uo - 1.2, tilt);
      const f = [end[0] + fx, end[1] + fy];
      sub.addPath(nib([end, f], () => 0.3, { raw: true }));
      const fl = unfold(phase(t, TL.florets + delay * 0.9 + j * 0.06, 0.7));
      const sd = smooth(phase(t, TL.seedsSet + delay * 1.2 + j * 0.08, 0.8));
      const dropK = t > p.drop + 0.1 + delay * 0.8;
      if (fl > 0) florets.push([f[0], f[1], 2.0 * fl * (1 - sd)]);
      if (sd > 0 && !dropK) seeds.push([f[0], f[1], sd, tilt + sj * 0.6]);
    }
  }
  sky(F, p, S, () => {
    flesh(F, rays, S.dry > 0.05);
    flesh(F, sub, S.dry > 0.05);
    const fl = new Path2D();
    for (const [x, y, rr] of florets) if (rr > 0.05) fl.addPath(disc(x, y, rr));
    F.f('sun', 1, fl);
    const sd = new Path2D();
    for (const [x, y, s, a] of seeds) sd.addPath(ellipse(x, y - 0.4, 0.95 * s, 1.9 * s, a));
    F.f('brown', 1, sd);
    // bracts at the ray base
    for (const side of [-1, 1]) leaf(F, tip[0], tip[1], dir + Math.PI + side * 0.5, 5 * bud, 0.9, { bend: 0, dry: S.dry > 0.05 });
  });

/* pollen: a grass whose hanging anthers shed grains that drift to the flower */
function grassGeo(t) { const p = P.grass, S = stateOf(p, t); return { p, S, sp: mainStem(p, t, S, { swayAmp: 0.08, curl: -0.55 }) }; }
function antherPoints(t) {
  const { S, sp } = grassGeo(t);
  const tip = spineAt(sp, sp.len), dir = spineDir(sp, sp.len);
  const head = [];
  const HL = 50 * unfold(phase(t, P.grass.shoot + P.grass.grow - 2.4, 2.0));
  for (let i = 0; i <= 8; i++) { const u = i / 8, a = dir + 0.9 * u; head.push([tip[0] + Math.cos(dir) * HL * u + Math.cos(a) * 0, tip[1] + Math.sin(dir) * HL * u + u * u * HL * 0.55]); }
  const an = unfold(phase(t, TL.anthers, 1.0)) * (1 - smooth(phase(t, P.grass.dry, 1.2)));
  const pts = [];
  const sw = wander('garden:anther', [5, 9]);
  for (let i = 0; i < 8; i++) {
    const u = 0.14 + i * 0.1, h = head[Math.min(8, Math.round(u * 8))];
    const L = (7 + (i % 3) * 2.2) * an, a = Math.PI / 2 + sw(t + i * 0.7) * 0.35 + (i % 2 ? 0.25 : -0.2);
    pts.push({ at: h, end: [h[0] + Math.cos(a) * L, h[1] + Math.sin(a) * L], a, an });
  }
  return { head, pts, S, sp, HL };
}
function sceneGrass(F, t) {
  const { p, S, sp } = grassGeo(t);
  drawRoots(F, p, S, rootSet(p, 7, 30, 20));
  const A = antherPoints(t);
  seedLife(F, p, t, (tt) => { const h = antherPoints(tt).head; return h[4]; });
  soilStem(F, sp, S, 1.7, 1.2);
  sky(F, p, S, () => {
    drawStem(F, sp, S, 1.7, 1.0);
    tipBud(F, sp, S);
    // blades from the base, long and arching
    const bl = unfold(phase(t, p.shoot + 1.2, 2.6));
    [[-1, 58, 0.5], [1, 46, 0.62], [-1, 34, 0.9]].forEach(([side, L, a0], i) => {
      const s = SEED_D + 6 + i * 10;
      if (sp.len < s) return;
      const n = spineAt(sp, s);
      const pts = [];
      const Lg = L * bl * (1 - S.fold * 0.2);
      for (let k = 0; k <= 6; k++) { const u = k / 6, a = -Math.PI / 2 + side * (a0 + 1.4 * u * u + S.fold * 0.8 * u); pts.push([n[0] + side * 0 + Math.cos(a) * Lg * u * 0.9 + side * u * 2, n[1] + Math.sin(a) * Lg * u * 0.75]); }
      flesh(F, nib(curve(pts, false, 3), (u) => 1.6 * (1 - u) * Math.min(1, u * 8), { raw: true }), S.dry > 0.5);
    });
    // the head: spikelets along a nodding rachis
    if (A.HL > 0.5) {
      const rach = nib(A.head, () => 0.6, { per: 2 });
      const sk = new Path2D();
      for (let i = 1; i <= 8; i++) {
        const h = A.head[i], prev = A.head[i - 1], a = Math.atan2(h[1] - prev[1], h[0] - prev[0]);
        const side = i % 2 ? 1 : -1, s = Math.min(1, A.HL / 20);
        sk.addPath(ellipse(h[0] + Math.cos(a + side * 1.2) * 2.2 * s, h[1] + Math.sin(a + side * 1.2) * 2.2 * s, 4.6 * s, 1.9 * s, a + side * 0.55));
      }
      flesh(F, rach, S.dry > 0.1);
      flesh(F, sk, S.dry > 0.1);
      const fil = new Path2D(), anth = new Path2D();
      for (const q of A.pts) {
        if (q.an <= 0.02) continue;
        fil.moveTo(q.at[0], q.at[1]); fil.lineTo(q.end[0], q.end[1]);
        anth.addPath(ellipse(q.end[0] + Math.cos(q.a) * 2.2, q.end[1] + Math.sin(q.a) * 2.2, 3.0 * q.an, 1.3 * q.an, q.a));
      }
      F.s('brown', 1, fil, 0.4);
      F.f('sun', 1, anth);
      F.f('brown', 0.25, anth);
    }
  });
}

/* the grains: seeded births, curved drifts, grown in and shrunk out, never popped */
const GRAINS = (() => {
  const r = rngFor('garden:grains'), out = [];
  const [a, b] = TL.pollen;
  const n = 36;
  for (let i = 0; i < n; i++) {
    const birth = a + (i / n) * (b - a - 3.9) + r() * 0.12;
    const kind = r();
    let to;
    if (kind < 0.72) to = [771 + (r() - 0.5) * 14, 112 + (r() - 0.5) * 10];     // to the flower

/* ── the player: sized to its box, paused off screen, still when asked ─── */

function mount(root) {
  const stage = root.querySelector('.pp-film-stage'), canvas = stage.querySelector('canvas');
  const film = createFilm(canvas);
  const reduce = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const api = { duration: DUR, ready: false, still: STILL, shots: SHOTS, quiet: QUIET, playing: false };
  let at = START, last = null, raf = 0, visible = true, wanted = true, pending = 0, cost = [], fps = FPS, shown = -1;
  const size = () => {
    const r = stage.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    return [Math.max(2, Math.round(r.width * dpr)), Math.max(2, Math.round(r.height * dpr)), dpr];
  };
  function rebake() {
    const [w, h, dpr] = size();
    const [cw, ch] = film.size();
    if (w === cw && h === ch) return;
    film.bake(w, h, dpr);
    api.ready = true;
    shown = -1;
    film.render(reduce.matches || api.degraded ? STILL : at);
  }
  function frame(now) {
    raf = 0;
    if (!api.playing) return;
    if (last !== null) at = (at + Math.min(0.1, (now - last) / 1000)) % DUR;
    last = now;
    const step = Math.floor(at * fps);
    if (step !== shown) {
      shown = step;
      const t0 = performance.now();
      film.render(step / fps);
      cost.push(performance.now() - t0); if (cost.length > 45) cost.shift();
      // without a GPU canvas a frame can cost 80 ms or more: fall back to a
      // 12 fps flip-book, and past that to the still, rather than jank the page
      if (cost.length === 45) {
        const med = cost.slice().sort((a, b) => a - b)[22];
        if (fps === FPS && med > 26) { fps = 12; cost = []; }
        else if (fps === 12 && med > 40) { api.degraded = true; api.playing = false; film.render(STILL); return; }
      }
    }
    raf = requestAnimationFrame(frame);
  }
  function update() {
    const go = wanted && visible && !document.hidden && !reduce.matches && api.ready && !api.degraded;
    if (go && !api.playing) { api.playing = true; last = null; raf = raf || requestAnimationFrame(frame); }
    if (!go && api.playing) { api.playing = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    if (reduce.matches && api.ready) film.render(STILL);
  }
  api.seek = (t) => { api.playing = false; wanted = false; if (raf) cancelAnimationFrame(raf); raf = 0; at = t; film.render(t); };
  api.play = () => { wanted = true; update(); };
  api.pause = () => { wanted = false; update(); };
  api.cost = () => cost.slice();
  api.fps = () => fps;
  api.render = (t) => film.render(t);
  api.stats = film.stats;
  new ResizeObserver(() => { clearTimeout(pending); pending = setTimeout(() => { rebake(); update(); }, api.ready ? 150 : 0); }).observe(stage);
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; update(); }).observe(stage);
  document.addEventListener('visibilitychange', update);
  // a theme switch changes the inks; redraw now if the film is not playing to pick it up
  new MutationObserver(() => { if (api.ready && !api.playing) film.render(reduce.matches || api.degraded ? STILL : at); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (reduce.addEventListener) reduce.addEventListener('change', update);
  root.__film = api;
  rebake(); update();
}

document.querySelectorAll('.pp-film').forEach(mount);
})();
</script>
