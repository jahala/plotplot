<!--
  plotplot · the inchworm, shared asset. A looper on the header's bottom line: a two-anchor gait
  with a constant body length, rearing up to look about every few strides, stiff as a twig while a
  pointer is near. No legs. Static worm without JS; hidden under prefers-reduced-motion.
  Paste three things: the markup as the last child of the page's sticky header (its .wrap needs
  position:relative and z-index:1 so the nav sits above the worm), the style, and the script.
-->
  <!-- inchworm: a looper walking the header line. static worm without JS; hidden under reduced motion -->
  <div class="inchworm" aria-hidden="true">
    <svg fill="none">
      <path class="iw-body" d="M22 37.5 C23.5 16, 42.5 16, 44 37.5"/>
      <path class="iw-rings" d="M22 37.5 C23.5 16, 42.5 16, 44 37.5"/>
      <circle class="iw-head" cx="45.5" cy="36" r="3.4"/>
      <circle class="iw-eye" cx="46.8" cy="35" r="1"/>
    </svg>
  </div>

<style>
  /* inchworm: walks the header's bottom line (ground = container y 40); body and head from the family green */
  .inchworm{position:absolute;left:0;right:0;bottom:-4px;height:44px;overflow:hidden;pointer-events:none;z-index:0}
  .inchworm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .iw-body{stroke:var(--pp-primary);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .iw-rings{stroke:var(--pp-forest);stroke-width:5;stroke-dasharray:1 3.5;opacity:.35}
  .iw-head{fill:var(--pp-primary)}
  .iw-eye{fill:var(--pp-bg)}
  @media (prefers-reduced-motion: reduce){ .inchworm{display:none} }
</style>

<script>
// inchworm: a looper on the header line. two-anchor gait with a constant body length: the rear is
// drawn up into an arch, then the front reaches forward. every few strides it rears up and sways,
// looking about; if a pointer comes close it finishes its step and goes stiff as a twig until the
// pointer leaves. walks off the right edge, waits, walks in again. honours reduced motion.
(function(){
  var box=document.querySelector('.inchworm'); if(!box) return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var svg=box.querySelector('svg'), header=box.parentNode;
  var body=svg.querySelector('.iw-body'), rings=svg.querySelector('.iw-rings');
  var head=svg.querySelector('.iw-head'), eye=svg.querySelector('.iw-eye');
  var G=40, base=G-2.5, L=34, Lmin=10, DRAW=560, REACH=640, SENSE=2800, RISE=420;
  var W=box.clientWidth; window.addEventListener('resize',function(){W=box.clientWidth;});
  var rear, front, phase='away', tp=0, wait=1400, strides=0, nextSense=0, hover=false, left=0, angle=0;
  function begin(){front=-30;rear=front-L;phase='draw';tp=0;strides=0;nextSense=4+Math.floor(Math.random()*5);}
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
  // cubic from rear to front; find the arch height that keeps the body length at L
  function archLen(xr,xf,h){var k=(xf-xr)*.08,x0=xr,y0=0,len=0,i,t,u,x,y;
    for(i=1;i<=16;i++){t=i/16;u=1-t;x=u*u*u*xr+3*u*u*t*(xr+k)+3*u*t*t*(xf-k)+t*t*t*xf;y=-(3*u*u*t+3*u*t*t)*h;
      len+=Math.sqrt((x-x0)*(x-x0)+(y-y0)*(y-y0));x0=x;y0=y;} return len;}
  function arch(xr,yr,xf,yf){var lo=0,hi=L,h,i;for(i=0;i<14;i++){h=(lo+hi)/2;if(archLen(xr,xf,h)<L)lo=h;else hi=h;}
    var k=(xf-xr)*.08;return 'M'+xr.toFixed(1)+' '+yr.toFixed(1)+' C'+(xr+k).toFixed(1)+' '+(yr-h).toFixed(1)+', '+(xf-k).toFixed(1)+' '+(yf-h).toFixed(1)+', '+xf.toFixed(1)+' '+yf.toFixed(1);}
  // rear half flat on the line, front half raised at angle a (degrees) from a soft bend
  function raised(a){var r=a*Math.PI/180,p=rear+L*.45,s=L*.55-4,bx=p+4*Math.cos(r),by=base-4*Math.sin(r);
    var fx=bx+s*Math.cos(r),fy=by-s*Math.sin(r);
    return {d:'M'+rear.toFixed(1)+' '+base+' L'+(p-4).toFixed(1)+' '+base+' Q'+p.toFixed(1)+' '+base+' '+bx.toFixed(1)+' '+by.toFixed(1)+' L'+fx.toFixed(1)+' '+fy.toFixed(1),fx:fx,fy:fy,r:r};}
  function draw(d,fx,fy,tilt){
    body.setAttribute('d',d);rings.setAttribute('d',d);
    var hx=fx+1.5*Math.cos(tilt)+1*Math.sin(tilt), hy=fy-1.5*Math.sin(tilt)-1*Math.cos(tilt)+0;
    head.setAttribute('cx',hx.toFixed(1));head.setAttribute('cy',hy.toFixed(1));
    eye.setAttribute('cx',(hx+1.3*Math.cos(tilt)+.4).toFixed(1));eye.setAttribute('cy',(hy-1-1.3*Math.sin(tilt)).toFixed(1));}
  header.addEventListener('mousemove',function(e){var b=box.getBoundingClientRect(),x=e.clientX-b.left;
    hover=phase!=='away'&&Math.abs(x-(rear+front)/2)<80;if(hover)left=0;});
  header.addEventListener('mouseleave',function(){hover=false;});
  var last=0;
  function frame(ts){
    var dt=last?Math.min(80,ts-last):16;last=ts;tp+=dt;var t,fy=base,ry=base,p;
    if(phase==='away'){box.style.visibility='hidden';if(tp>=wait){begin();box.style.visibility='visible';}requestAnimationFrame(frame);return;}
    if(phase==='draw'){t=Math.min(1,tp/DRAW);rear=(front-L)+(L-Lmin)*ease(t);ry=base-Math.sin(t*Math.PI)*2.5;
      draw(arch(rear,ry,front,base),front,base,0);if(t>=1){phase='reach';tp=0;}}
    else if(phase==='reach'){t=Math.min(1,tp/REACH);front=(rear+Lmin)+(L-Lmin)*ease(t);fy=base-Math.sin(t*Math.PI)*2.5;
      draw(arch(rear,base,front,fy),front,fy,0);
      if(t>=1){strides++;tp=0;phase=hover?'twig':(strides>=nextSense?'sense':'draw');}}
    else if(phase==='sense'){t=tp/SENSE;
      if(t<.25)angle=50*ease(t/.25);else if(t<.78)angle=50+9*Math.sin((t-.25)/.53*Math.PI*4);else angle=50*(1-ease(Math.min(1,(t-.78)/.22)));
      p=raised(angle);draw(p.d,p.fx,p.fy,p.r);
      if(t>=1){phase='draw';tp=0;strides=0;nextSense=4+Math.floor(Math.random()*5);}}
    else if(phase==='twig'){ // rigid, straight, like a twig; holds while the pointer is near
      if(!hover)left+=dt;
      if(hover||left<900)angle=Math.min(38,angle+38*dt/RISE);else angle=Math.max(0,angle-38*dt/RISE);
      p=raised(angle);draw(p.d,p.fx,p.fy,p.r);
      if(!hover&&left>=900&&angle<=0){phase='draw';tp=0;left=0;}}
    if(rear>W+30){phase='away';tp=0;wait=3000+Math.random()*4000;}
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();
</script>
