# receipts — what produced a change and what verified it
**Goal.** A signed statement per commit: the harness and model that produced it, the conductor and node if any, the files it touched, what verified it (weeder's SARIF digest, tend2 stamps, pleach gates, test commands), what it cost, and a friction summary, as an in-toto Statement whose subject is the commit's own git hash, stored as a git note, signed keyless through Sigstore in CI. Provenance is compliance now and trust always; a receipt outlives the vendor. The plan is `docs/plans/receipts.md`. v0 (draft, seal, verify, notes) is built with the stem; v1 (signing, the PR check, the GitHub mirror) waits for a second reader or a policy that requires it.

## What binds the pieces

The predicate schema lives in [contracts](contracts.tend2.html); every face is on the [stem](stem.tend2.html)'s binary; [weeder](weeder.tend2.html) contributes its SARIF digest, [tend2](tend2.tend2.html) its stamps and principal vocabulary, [pleach](pleach.tend2.html) its plan, node and gates, and [umbel](umbel.tend2.html) its token telemetry, which is also how pleach's handback gap on spend gets filled.

## Tried
- 2026-09-06 shaped from the plan; the direction memo's "wait for a second reader" survives as the activation gate for v1 signing, while v0 is small enough to build with the stem and is the record a reviewer reads
- 2026-09-06 standards chosen instead of a schema of our own: in-toto Statement v1 with gitCommit and gitTree digests as the subject, DSSE, Sigstore keyless via cosign, git notes for storage, GitHub attestations as an optional mirror; SLSA provenance is for builds and is not the predicate; gitsign signs commits but has no attestation command, so commit signing and receipts stay separate layers
- 2026-09-06 stated limit: a receipt records what the harness reported; a harness that misreports its model is not caught by it; principal is a claim, the signature is the only proof of who sealed
- 2026-09-09 from the stem builder: seal, verify and show landed in the stem (jahala/plotplot, third run) against the plan's §3 shape, keys in that order, since the predicate schema has not landed in contracts; v0 notes are unsigned and `--require-signed` refuses them; `sign` waits on its activation gate. Seal folds every draft under `.plotplot/receipts/drafts/` and moves them under `sealed/<commit>/`; `createdAt` is left out of the sameness comparison so a second seal is unchanged. Learned: `git clone` copies no refspecs, so a fresh clone carries the receipts ref only after `plotplot init` sets the fetch refspec there; the verify check asserts exactly that
- 2026-09-10 the owner delegated the reading ("you decide") and the umbrella agent read the first real receipt, sealed on the planting commit b6643b8: producer plotplot 0.1.0, the twelve planted files, weeder 0.2.1's verdict with the allowed guardrail findings at note level, and null for harness, model, sessions and cost because a person made the commit from a shell; it says what happened and who verified it and invents nothing it cannot know, which is what a reviewer wants; approved in the owner's name
