# pleach — the conductor, gating at the node
**Goal.** pleach conducts a DAG of verified agent work in isolated worktrees and publishes only what passed its gates. To belong to the tended repository it adopts three things: the test phase commits separately from the implementation, so `weed bite` is a checkout and a run; `weed check --strict` is its default smoke gate, so honesty is judged at the node before the pull request; and every node's handback must carry a Tried entry, so the theory of the program is written by whoever changed it. Its plan schema stays the plan contract. Module work lives in `~/conductor/repos/pleach/docs/tend2/`.

## Tests
- [ ] (code) fit contract F1, F3, F4, F5, F6 pass for pleach at the pinned version: manifest, standalone install, zero declared context cost, verified-close-rate metric committed, brand layer and footer · scripts/fit/pleach.sh
- [ ] (code) a phased node commits the red phase as its own commit before the impl phase begins, and the GREEN gate runs against the combined tree · scripts/fit/pleach.sh test-commit
- [ ] (code) a plan with no `accept.smoke` defaults to `weed check --strict` when weed is on PATH and fails closed with a named reason when it is not · scripts/fit/pleach.sh default-smoke
- [ ] (code) a node whose worker handback contains no dated Tried line is classified retryable with the evidence naming the missing section, not published · scripts/fit/pleach.sh tried-required
- [ ] (code) the published `node/<id>` branch carries an in-toto statement naming harness, model, provider, and the gates passed, signed in CI · scripts/fit/pleach.sh attestation
- [ ] (code) `bunx github:jahala/pleach validate plan.json` works from a public repository on a clean machine · scripts/fit/pleach.sh public
- [ ] (code) a node whose worker dies carries the tail of the worker's output in the verdict's evidence, so the journal shows why, never a bare "dead" · scripts/fit/pleach.sh dead-evidence
- [ ] (human) the owner confirms the landing page qualifies the slogan once: code decides what code can decide; the audit is a second model's judgment in a shape code can refuse
