# tilth — the reader, and the eye of the judge
**Goal.** tilth stays what it is, structural reading of code for agents with a measured cost-per-correct gain, and becomes the parsing substrate the garden's judge is built on: a `tilth-core` library crate exposing tree-sitter outlines, symbol search, test-file classification, and dependency analysis, which weeder depends on inside the same Cargo workspace. Its instruction block moves into a skill so it costs nothing at startup. Module work lives in tilth's own repo at `~/CascadeProjects/tilth`.

## Why the substrate matters more than the reader

As context windows grow and cheapen, pure navigation becomes less scarce; the parser does not. Deleted tests, weakened assertions, and dependency-direction violations are structural facts about a diff, and tilth already knows how to see structure in fourteen languages. The reallocation is recorded in Tried and in `docs/garden-2031.md` §6.
