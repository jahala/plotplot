# umbel — one unit of agent work, on any provider
**Goal.** umbel runs one unit of agent work reliably on Claude Code, Codex, Gemini, or OpenCode and hands back a typed result. To belong to the tended repository it stays a channel with a diet: six tools plus help instead of twelve, a headless structured-output adapter alongside tmux for providers that ship one, and its invoke signature kept as the unit contract pleach depends on. Module work lives in `~/conductor/repos/rctrl/docs/tend2/`.

## Tests
- [ ] (code) fit contract F1, F3, F4, F5, F6 pass for umbel at the pinned version: manifest, standalone install, declared context cost at or under 900 tokens, metric committed, brand layer and footer · scripts/fit/umbel.sh
- [ ] (code) the MCP server lists at most seven tools, capture, logs, actions, diff, status, and ls folded behind one inspect tool, and the umbel workflow suite still passes · scripts/fit/umbel.sh diet
- [ ] (code) a headless adapter drives a provider's structured-output mode for one unit and returns the same typed result shape the tmux adapter returns · scripts/fit/umbel.sh headless
- [ ] (code) the scheduled real-binary smoke runs against each provider's current release and reports drift as a failing check rather than a silent pass · scripts/fit/umbel.sh drift
- [ ] (code) the metric, units completed per dollar and per provider from the run journal, is computed and committed · scripts/fit/umbel.sh metric
- [ ] (code) a worker spawned into a fresh, untrusted cwd on the current Claude Code release survives the trust dialog and reaches its first prompt, and the scheduled real-binary smoke includes this case so a changed dialog default fails a check instead of killing fleets silently · scripts/fit/umbel.sh trust-dialog
