# plotplot — the repo is the harness
**Goal.** A repository that carries its own intent with proof, its own law, its own structure, a findings channel, and a yardstick — so any agent on any vendor is a worker against it, and the judgment is owned, not rented. plotplot is the open contracts that define such a repository and the independent tools that implement them. This map holds the fit: each child is one bed, and its checks ask whether that bed belongs to the garden. The beds' own maps hold whether they work.

## What this map proves

The stem's [proof run](stem.tend2.html) is the integration check for the whole garden: a fresh clone of a fixture repository is planted, a plan runs through pleach with two umbel workers, a planted test deletion is refused by weed, a check is stamped with the verifier's version, and every gate's findings arrive as one SARIF log. The [contracts](contracts.tend2.html) child owns the schemas and the fit runner every other child is verified with. The brief every builder reads is `docs/building-the-garden.md`.

## Tests
- [ ] (code) every bed loop on this map has its fit checks stamped and the proof run passes on the pinned season · scripts/fit/all.sh
