# weed — the judge of the diff
**Goal.** A static binary that reads a diff an agent produced and refuses the growth that should not be there: deleted or weakened tests, skips, stubs, swallowed errors, secrets, guardrail edits, dependency-direction violations. Three subcommands: `check` emits SARIF; `guard` is the law at commit and push through git hooks; `bite` proves a test fails without the change. It runs in milliseconds with zero tokens, at pre-commit, pre-push, Stop, in pleach as the smoke gate, and in CI as a GitHub Action posting to code scanning. The build brief is `docs/prompts/weed-build-2026-09.md`, amended here: SARIF not a findings schema, guard replaces hedge, and the crate lives in the tilth workspace.

## Only the unambiguous blocks

A false block costs a retry, and agents learn to add allowances. So a deleted test, an added skip, a stub in production code, a secret, an edited guardrail file, and a conflict marker block; everything else warns, and warnings are for the human at the pull request, not for the agent. Calibration on real history decides whether weed ships at all, and the kill bar is written before the first rule.

- [ ] (agent) the calibration classification is re-graded by an independent party — a pleach audit on a different provider or the owner — on a random sample of at least twenty blocked commits and twenty injected cases, with agreement at or above 90 percent; below that the classification is untrusted and redone · docs/calibration-2026-09.md
- [ ] (code) the suppression rate, `Weed-allow` trailers per hundred commits on the garden repos since guard was installed, is computed and reported beside precision in the calibration file · scripts/fit/weed.sh suppressions
