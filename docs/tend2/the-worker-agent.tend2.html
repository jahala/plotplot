# The worker agent: any vendor's agent, working against a repository that decides
**Who.** A coding agent, on any harness and any vendor, handed one unit of work in a tended repository: a check to prove, a node to build, a review to give. It is fast, literal, and forgetful between sessions. It has no memory of the product beyond the files in front of it, and its own account of its work is not evidence.

The worker opens a repository it has never seen. The core page says what the product is and what done means; the work order carries the claim, the evidence command and the few rules that apply to the files it will touch; the map says which checks are open. It builds, runs the evidence, and stops. The verifier, the diff judge and a second provider's auditor decide, and a receipt records what verified the change.

## Jobs
- When I start in a repository I do not know, I want what it is for, its shape and what done means on one page the harness loads by itself, so I do not guess · from the law §3, the references every bed keeps
- When I am handed a check, I want a claim I can prove and an evidence command that prints its result, so I know when I am finished · from the law §2 and tend2's format
- When I have finished, I want a stop to mean my final message is read in full, so my handback is not lost · from jahala/umbel 86 and contracts/runner.md
- When I touch a file, I want to know what usually changes with it and what a change like mine has broken before, so I do not leave a partner behind · from the quadrat experiment, docs/experiment/README.md in jahala/quadrat
- When I have a secret to use, I want it read at the moment of use and never on my command line, so I cannot leak it · from jahala/umbel 93

## Basis
Written from the garden's work orders, the law and the faults its agents met between 2026-09-15 and 2026-09-24, recorded on this map's loops; no agent was interviewed.
