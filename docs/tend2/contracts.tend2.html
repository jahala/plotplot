# contracts — the umbrella is the contracts
**Goal.** Five small, versioned contracts that let independent tools be one garden without knowing each other: the bed manifest, the judges lockfile, SARIF as the findings channel, and the two that already exist where they live — tend2's loop format and pleach's plan schema. Plus the fit runner that verifies any bed against them from this repo. If a tool nobody in the garden wrote can join by shipping one `garden.json`, this loop is done.

## What lives here and what deliberately does not

Two new schemas, `manifest` and `lock`, small enough to read in a minute. No findings schema: SARIF 2.1.0 exists and GitHub, every editor, and every CI already read it. No receipt schema: in-toto statements exist. No briefing schema until push orientation earns one. The fit runner `scripts/fit/lib.sh` resolves a bed's pinned version from `garden.lock`, fetches it into a temp directory, verifies the checksum, and runs the named check; each `scripts/fit/<bed>.sh` composes it. Loop and plan stay owned by [tend2](tend2.tend2.html) and [pleach](pleach.tend2.html); this loop only pins which versions the garden speaks.

## Tests
- [ ] (code) `contracts/manifest.schema.json` validates every bed's committed `garden.json` and rejects each of the negative fixtures (missing kind, undeclared context cost, no metric command) · contracts/test/manifest.test.sh
- [ ] (code) `contracts/lock.schema.json` validates `garden.lock` and the fit runner refuses a pinned artifact whose checksum does not match · contracts/test/lock.test.sh
- [ ] (code) every gate in the garden emits SARIF 2.1.0 that validates against the official schema, checked on one fixture per bed with a check face (weed, petals, tend2 lint) · contracts/test/sarif.test.sh
- [ ] (code) the fit runner fetches a pinned bed into a clean temp directory and runs a named check, with no other garden tool on PATH · contracts/test/fit-runner.test.sh
- [ ] (code) the loop format version tend2 ships and the plan schema version pleach ships match the versions this repo pins · contracts/test/pins.test.sh
- [ ] (code) `contracts/friction-profile.md` pins the OpenTelemetry GenAI event names and attributes the garden uses, including one required path attribute, and a fixture journal validates against it · contracts/test/friction-profile.test.sh
- [ ] (human) the owner reads the two new schemas and agrees they are the whole umbrella — nothing a bed needs to belong is missing, nothing is there that a bed does not need


## Tried
- 2026-09-05 eleven contracts cut to five after the fan-in test: only findings had many producers and consumers, and findings is SARIF, not ours
- 2026-09-05 scope-out: no schema registry, no seasons ceremony, no additive-only rule as process — one end-to-end proof on pinned versions keeps contracts honest; fixtures serve the satellites
- 2026-09-05 the fit runner lives here rather than in the stem because it verifies beds from the umbrella; the stem consumes the lock, this loop defines it
- 2026-09-05 settled with tend2 on the channel: friction is federated — contracts pins an OpenTelemetry profile (not a schema of our own), each bed emits its own domain's events, tend2 owns the reducer and hot spots; rides step 1
- 2026-09-05 settled with tend2 on the channel: time is deliberately external — no bed grows a scheduler; cadence commands are idempotent CLIs; scheduler configuration lives in the repo as workflow files or a local cron layer
