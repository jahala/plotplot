# contracts — the umbrella is the contracts
**Goal.** Five small, versioned contracts that let independent tools be one garden without knowing each other: the bed manifest, the judges lockfile, SARIF as the findings channel, and the two that already exist where they live — tend2's loop format and pleach's plan schema. Plus the fit runner that verifies any bed against them from this repo. If a tool nobody in the garden wrote can join by shipping one `garden.json`, this loop is done.

## What lives here and what deliberately does not

Two new schemas, `manifest` and `lock`, small enough to read in a minute. No findings schema: SARIF 2.1.0 exists and GitHub, every editor, and every CI already read it. No receipt schema: in-toto statements exist. No briefing schema until push orientation earns one. The fit runner `scripts/fit/lib.sh` resolves a bed's pinned version from `garden.lock`, fetches it into a temp directory, verifies the checksum, and runs the named check; each `scripts/fit/<bed>.sh` composes it. Loop and plan stay owned by [tend2](tend2.tend2.html) and [pleach](pleach.tend2.html); this loop only pins which versions the garden speaks.
