# weeder — the judge of the diff
**Goal.** A static binary that reads a diff an agent produced and refuses the growth that should not be there: deleted or weakened tests, skips, stubs, swallowed errors, secrets, guardrail edits, dependency-direction violations. Three subcommands: `check` emits SARIF; `guard` is the law at commit and push through git hooks; `bite` proves a test fails without the change. It runs in milliseconds with zero tokens, at pre-commit, pre-push, Stop, in pleach as the smoke gate, and in CI as a GitHub Action posting to code scanning. The build brief is `docs/prompts/weeder-build-2026-09.md`, amended here: SARIF not a findings schema, guard replaces hedge, and the crate lives in the tilth workspace.

## Only the unambiguous blocks

A false block costs a retry, and agents learn to add allowances. So a deleted test, an added skip, a stub in production code, a secret, an edited guardrail file, and a conflict marker block; everything else warns, and warnings are for the human at the pull request, not for the agent. Calibration on real history decides whether weeder ships at all, and the kill bar is written before the first rule.
