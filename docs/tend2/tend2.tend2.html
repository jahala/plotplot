# tend2 — the center of proof
**Goal.** tend2 is where intent lives with proof: a loop per feature, checks only a verifier can close, Tried as the theory of the program, state derived from the boxes. To belong to the tended repository it needs three additions and one instrument: the stamp names the verifier's identity and version so proof is reproducible; Tried is a required, machine-checked output of every work order; lint emits SARIF; and the friction ledger turns "agents stumble here" from anecdote into a number that shapes the next simplification loop. Module work lives in tend2's own map at `~/conductor/workspaces/feature-map/missoula/docs/tend2/`.

## The friction ledger

A hook script records events in the OpenTelemetry GenAI shape — denials per rule, retries per tool, repeated reads of one file, test-run loops, edit churn per path — into a journal the repo ignores or commits as it chooses. A reducer ranks paths by friction. `tend2 next` surfaces the hot spots beside needs-you, and a shaped simplification loop cites them. Nothing here asks a model anything; that was mull's mistake and this loop's Tried records why.
