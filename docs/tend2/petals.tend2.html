# petals — brand and voice as files, checked by code
**Goal.** petals already has the shape a bed should have: a skill for the judgment work of extracting a brand, and a deterministic check that runs with zero tokens. To belong to the tended repository it emits SARIF from that check, cuts its skill description to one sentence, and goes public. It is also the template every other bed's brand layer copies. Module work lives in `~/conductor/repos/petal/docs/tend2/`.

## Tests
- [ ] (code) fit contract F1 to F6 pass for petals at the pinned version: manifest, SARIF from check, standalone install, declared context cost at or under 80 tokens, metric committed, brand layer and footer · scripts/fit/petals.sh
- [ ] (code) `check.sh --format sarif` emits SARIF 2.1.0 with one result per finding carrying rule id, file, line, and the nearest-palette suggestion as the fix text · scripts/fit/petals.sh sarif
- [ ] (code) the skill description is one sentence under 160 characters and the body carries every workflow the old description listed · scripts/fit/petals.sh skill
- [ ] (code) the repository is public and `/petals init --from` the plotplot umbrella works from a clean clone · scripts/fit/petals.sh public
- [ ] (code) the umbrella's own page and every bed's page pass the check with zero errors on the umbrella-plus-product resolution · scripts/fit/petals.sh garden-pass
- [ ] (code) the check reports an em dash in page copy as a voice error while exempting HTML comments and imitated chrome such as a terminal window title, proven on the umbrella page at zero errors and on a fixture with one dash in a paragraph at one error · scripts/fit/petals.sh em-dash
