# stem — one way to plant the garden, and the proof it fits
**Goal.** `plotplot` plants every bed into any harness and proves it is planted: three generated bundles (Claude Code plugin, Gemini extension, Codex config), `init` that writes the garden block and turns the git law on, `doctor` that proves each hook actually fires, `check` that runs every gate and returns one SARIF log, and a lockfile wrapper that fetches pinned judges on first use. This loop also owns the garden's integration check — the proof run — because the stem is the only program that touches every bed.

## Why this and not more

The stem is not an orchestrator (pleach conducts), not a runtime (umbel runs), not a package manager (each manifest says cargo, npm, pip, or curl), not a server. The review cut `run`, `walk`, the MCP gateway, and the briefing assembler; each is recorded below with the reason. What remains is the minimum that makes "nothing to install" true and makes the proof reproducible: pinned judges, bundles in the vendors' own formats, and one command that says whether the law is live.

## The proof run

`scripts/fit/proof.sh` builds a fixture repository with a deliberately flawed feature, plants the garden with `plotplot init`, emits a plan from its loops, runs it through pleach with two umbel workers on two providers, plants a test deletion in one worker's diff, and asserts five things in order: weed refused the deletion as a block-level SARIF result; the surviving node's check was stamped with the verifier's identity and version; `plotplot check` returned one SARIF log containing every gate's results; an in-toto statement for the merged node names the harness, model, and gates; and `plotplot doctor` on a second fresh clone reports every hook live with no global install performed.

## Tests
- [ ] (code) `plotplot init` on a fixture repo writes the garden block into `AGENTS.md`, the harness project configs, and sets `core.hooksPath` idempotently — running it twice changes nothing · scripts/fit/stem.sh init
- [ ] (code) `plotplot doctor` proves each installed hook fires by triggering it on Claude Code and Gemini CLI with real binaries, and reports Codex honestly as awaiting project trust · scripts/fit/stem.sh doctor
- [ ] (code) `plotplot check` runs every gate the manifests declare and emits one valid SARIF 2.1.0 log; exit 2 on any block-level result, 3 when a gate could not run · scripts/fit/stem.sh check
- [ ] (code) the lockfile wrapper fetches a pinned judge into an ignored directory, verifies its checksum, refuses a mismatch, and no binary is committed anywhere in the repo · scripts/fit/stem.sh lock
- [ ] (code) the three generated bundles install through each vendor's own mechanism on a clean machine and carry identical hooks, skills, and MCP entries · scripts/fit/stem.sh bundles
- [ ] (code) the garden block plus the skill description lines cost under 400 tokens on a deferring harness, measured by the same probe that measured 8,300 today · scripts/fit/stem.sh context
- [ ] (code) the proof run passes end to end on the pinned season · scripts/fit/proof.sh
- [ ] (code) every generated bundle carries the friction emitter and the receipt draft face as hook entries on the events the plans name, and `plotplot hook <harness> <event>` dispatches each event to the right face in under 50 ms · scripts/fit/stem.sh hook-faces
- [ ] (code) `plotplot doctor --live` drives one real session per present harness through umbel and proves from the friction journal and a marker file that each registered hook fired, reporting Codex as awaiting trust when it is · scripts/fit/stem.sh doctor-live
- [ ] (human) the owner confirms the `plotplot` npm name and the `@plotplot/*` scope, whether the stem's repository is `jahala/plotplot`, which beds `init` plants by default, and whether receipts are drafted by default
