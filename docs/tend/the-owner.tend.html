# The owner: decides what the garden becomes, and has to be able to trust what comes out
**Who.** The person who keeps a tended repository and directs the agents that work in it. They decide direction and do not arbitrate technical detail. They are not at the keyboard for most of the work: agents run for hours, land pull requests, and report; the owner reads the map, the receipts and the ledgers, and rules on what a person alone can rule on.

It is late evening. Four agents have landed eleven pull requests since the afternoon, every one green, and the owner has to decide in five minutes whether the day moved the product or only the tooling. The map says which checks are proven and by whom, the ledger says what was tried and refused, and a receipt names what verified each change. Without those, the only evidence is an agent's prose saying it went well.

## Jobs
- When agents have worked for hours without me, I want to see what is proven and what is merely claimed, so I can trust the state of the repository without reading the code · from the law, docs/building-the-garden.md §1 and §2
- When I give a direction, I want it to reach every agent the same way and hold across months of development, so nobody re-decides it differently · from the law §3, the references every bed keeps
- When something goes wrong overnight, I want the record to say what was tried, what was refused and why, so a mistake costs a night and not a week · from the law §2 and §7
- When I decide whether a tool becomes a bed, I want its kill criterion and its numbers in front of me, so I decide on evidence and not on a defence of the work · from the law §8
- When I am the only person, I want the tools to work with any vendor's agent, so no vendor decides what I can do · from the law §1, invariant 3

## Basis
Written by the umbrella agent from the law and from the owner's own rulings recorded on this map; not an interview. The owner is one person today; a second owner of a tended repository would test whether these jobs hold.
