# The tool author: brings a tool nobody in the garden wrote, and wants it to belong
**Who.** A developer with a tool of their own, on any stack, who wants it to work beside the garden's beds without asking anyone's permission: to be planted by the stem, checked by the umbrella, and to speak the same contracts. They will read one page of contracts and ship one manifest; they will not adopt a framework.

They have a checker that emits findings. The garden's contract says findings are SARIF and a bed ships a manifest, a check command, a metric and its references. They add a `garden.json`, make their check emit SARIF, and the fit runner proves the rest from the umbrella, with no other garden tool installed.

## Jobs
- When I bring my tool to the garden, I want one manifest and one page of contracts to be the whole of what belonging takes, so I keep my own design · from the law §3, the fit contract
- When my tool judges, I want the judge to be a different mechanism from the builder and its verdict in a shape code can refuse, so my verdicts are trusted · from the law §1, invariant 8
- When a contract changes, I want the page and its test to change first and both sides to see it, so my tool does not break at a seam · from the law §8, the seam rule
- When my tool is installed, I want it to cost an agent nothing until it speaks, so nobody removes it to save context · from the law §1, invariant 5

## Basis
Written from the fit contract and the seam rules of the law, and from tilth's questions of 2026-09-05 recorded in §3; no author outside the garden has been interviewed, and the first such author will test every job here.
